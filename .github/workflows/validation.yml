name: validation
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Run QA scenario integration tests (if present)
        run: |
          if [ -d integration_test ]; then
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build clang pkg-config libgtk-3-dev liblzma-dev xvfb
            flutter config --enable-linux-desktop
            if [ -f integration_test/scenario_test.dart ]; then
              xvfb-run -a flutter test integration_test/scenario_test.dart -d linux
            else
              for f in $(find integration_test -name '*_test.dart' | sort); do
                xvfb-run -a flutter test "$f" -d linux
              done
            fi
          fi
