<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATM-14: 카운터 초기 화면</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }
  .phone-frame {
    width: 375px;
    height: 780px;
    background: #F0F4FF;
    border-radius: 40px;
    overflow: hidden;
    box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 2px #333;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .status-bar {
    background: #3730A3;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 20px;
    gap: 6px;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.7); }
  .app-bar {
    background: #4F46E5;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 12px rgba(79,70,229,0.3);
  }
  .app-bar-title {
    color: #FFFFFF;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .screen-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 32px;
  }
  .scenario-badge {
    position: absolute;
    top: 80px;
    right: 12px;
    background: rgba(79,70,229,0.15);
    color: #4F46E5;
    font-size: 10px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 8px;
    border: 1px solid rgba(79,70,229,0.3);
  }
  .counter-card {
    width: 100%;
    background: #FFFFFF;
    border-radius: 24px;
    padding: 40px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 32px rgba(79,70,229,0.18), 0 2px 8px rgba(0,0,0,0.06);
  }
  .counter-label {
    font-size: 13px;
    font-weight: 600;
    color: #6B7280;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .counter-value {
    font-size: 96px;
    font-weight: 700;
    color: #4F46E5;
    line-height: 1;
    letter-spacing: -4px;
    font-variant-numeric: tabular-nums;
  }
  .counter-hint {
    font-size: 11px;
    color: #9CA3AF;
    margin-top: 4px;
  }
  .button-row {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .fab {
    width: 64px;
    height: 64px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 300;
    color: #FFFFFF;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    transition: transform 0.1s;
    position: relative;
    overflow: hidden;
  }
  .fab-decrement { background: linear-gradient(135deg, #EF4444, #DC2626); box-shadow: 0 4px 16px rgba(239,68,68,0.4); }
  .fab-increment { background: linear-gradient(135deg, #4F46E5, #4338CA); box-shadow: 0 4px 16px rgba(79,70,229,0.4); }
  .fab:active { transform: scale(0.92); }
  .fab-label {
    font-size: 10px;
    color: #9CA3AF;
    text-align: center;
    margin-top: 4px;
  }
  .fab-wrapper { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .reset-btn {
    background: transparent;
    border: 1.5px solid #E5E7EB;
    border-radius: 12px;
    padding: 10px 32px;
    font-size: 13px;
    font-weight: 600;
    color: #6B7280;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .reset-btn:hover { border-color: #4F46E5; color: #4F46E5; }
  .scenario-info {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(79,70,229,0.08);
    padding: 10px 16px;
    border-top: 1px solid rgba(79,70,229,0.12);
  }
  .scenario-info p {
    font-size: 10px;
    color: #4F46E5;
    font-weight: 600;
    text-align: center;
  }
</style>
</head>
<body>
<div style="display:flex; flex-direction:column; align-items:center; gap:20px;">
  <div style="color:#fff; font-size:13px; opacity:0.6; font-weight:500;">ATM-14 · 초기 화면 (카운트 = 0)</div>
  <div class="phone-frame">
    <div class="status-bar">
      <div class="status-dot"></div>
      <div class="status-dot"></div>
      <div class="status-dot"></div>
    </div>
    <div class="app-bar">
      <span class="app-bar-title">🔢 Flutter Counter</span>
    </div>
    <div class="scenario-badge">ATM-14</div>
    <div class="screen-body">
      <div style="text-align:center;">
        <div style="font-size:12px; color:#9CA3AF; font-weight:500; margin-bottom:4px;">시나리오</div>
        <div style="font-size:14px; color:#4F46E5; font-weight:700;">앱 최초 실행 시 초기 상태</div>
      </div>
      <div class="counter-card">
        <div class="counter-label">현재 카운트</div>
        <div class="counter-value">0</div>
        <div class="counter-hint">버튼을 눌러 카운트를 변경하세요</div>
      </div>
      <div class="button-row">
        <div class="fab-wrapper">
          <button class="fab fab-decrement">−</button>
          <div class="fab-label">감소</div>
        </div>
        <div class="fab-wrapper">
          <button class="fab fab-increment">+</button>
          <div class="fab-label">증가</div>
        </div>
      </div>
      <button class="reset-btn">↺ 초기화</button>
    </div>
    <div class="scenario-info">
      <p>✅ 초기 상태: count = 0 | 모든 버튼 활성화</p>
    </div>
  </div>
</div>
</body>
</html>
